<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Agrico — complete agriculture content review</title>
<style>
:root{color-scheme:light;--green:#164c38;--ink:#244535;--line:#d9e4d0;--muted:#657962}*{box-sizing:border-box}body{margin:0;background:#f7faf2;color:var(--ink);font:14px/1.8 system-ui,Arial,sans-serif}header{background:var(--green);color:white;padding:24px 28px}header h1{font-size:25px;line-height:1.3;margin:0 0 7px}header p{font-size:12px;color:#d5e6c5;margin:0}a{color:#28603c;overflow-wrap:anywhere}header a{color:#e9efba}.stats{display:flex;gap:8px;flex-wrap:wrap;padding:14px 25px;background:white;border-bottom:1px solid var(--line);font-size:11px}.stats span{background:#edf3e1;padding:6px 12px;border-radius:4px}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1500px;margin:auto}aside{position:sticky;top:0;height:100dvh;overflow:auto;padding:20px 17px;border-right:1px solid var(--line);background:white}aside label{font-size:11px;display:block;font-weight:600}input,select{font:inherit;padding:11px 12px;width:100%;margin:5px 0 12px;border:1px solid #cbd9c2;border-radius:4px;background:white;color:var(--ink)}aside button{width:100%;padding:11px 10px;border:1px solid transparent;background:none;color:var(--ink);text-align:left;font:inherit;font-size:12px;cursor:pointer;border-radius:4px;line-height:1.5}aside button[aria-current],aside button:hover{background:#edf3e2;border-color:#d3dfc5}aside button small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.count{font-size:11px;color:var(--muted);margin:6px 0 12px}main{min-width:0;padding:28px 34px 70px}main h1{font-size:30px;line-height:1.3;letter-spacing:-.5px;margin:7px 0 16px}.kind{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted)}.summary{font-size:16px;line-height:1.9}.byline{font-size:11px;color:var(--muted)}.hero-identity{display:flex;align-items:center;gap:17px}.logo{width:110px;min-width:110px;height:90px;padding:10px;background:white;border:1px solid var(--line);border-radius:5px;object-fit:contain}.dark{background:#173d30}.toc{background:#edf3e2;border:1px solid var(--line);padding:19px 22px;margin:25px 0;border-radius:4px}.toc h2{font-size:18px;margin:0 0 12px}.toc ol{columns:2;padding-left:20px;margin:0}.toc li{font-size:12px;break-inside:avoid;margin:4px 0 7px}.section{padding:28px 0;border-bottom:1px solid var(--line);scroll-margin-top:18px}.section h2{font-size:24px;line-height:1.35;margin:0 0 18px}.section h3{font-size:17px;line-height:1.4;margin:22px 0 10px}.section p{margin:10px 0 16px}.section ul{padding-left:22px}.section li{margin:7px 0}.table{overflow:auto;margin:22px 0;border:1px solid var(--line)}table{border-collapse:collapse;font-size:12px;min-width:580px;width:100%}td,th{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px;vertical-align:top;text-align:left;min-width:135px}thead th{background:#e6eed9}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:20px 0}.card{border:1px solid var(--line);background:white;border-radius:5px;padding:20px;min-width:0}.card h3{margin:6px 0 12px}.card p{font-size:12px;margin:8px 0}.card .logo{width:135px;height:70px;min-width:0}.card-kind{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:20px}figure{margin:0;min-width:0}figure img{width:100%;height:225px;object-fit:cover;border-radius:4px}figcaption{font-size:10px;line-height:1.7;color:var(--muted);margin-top:8px}.refs{font-size:10px!important;color:var(--muted)}.refs a{margin-left:6px}details{padding:13px 16px;border:1px solid var(--line);border-radius:5px;margin:10px 0;background:white}summary{font-weight:600;cursor:pointer}.sources{font-size:11px;padding-left:21px}.sources p{font-size:11px;color:var(--muted)}.university-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:23px 0}.university-tabs a{padding:8px 11px;background:white;border:1px solid var(--line);border-radius:4px;font-size:11px;text-decoration:none}.university-tabs a[aria-current]{background:var(--green);color:white}.notice{padding:13px 16px;border-left:3px solid #8da567;background:#edf2df;font-size:12px;margin:20px 0}.empty{padding:30px;border:1px dashed var(--line)}@media(max-width:1000px){.layout{grid-template-columns:245px minmax(0,1fr)}main{padding:25px}.toc ol{columns:1}.cards{grid-template-columns:1fr}}@media(max-width:650px){header{padding:22px 17px}.stats{padding:12px 17px}.layout{display:block}aside{position:static;height:auto;padding:17px}#list{max-height:230px;overflow:auto}input,select{font-size:16px;min-height:44px}main{padding:24px 17px}main h1{font-size:25px}.hero-identity{align-items:flex-start;gap:12px}.hero-identity .logo{width:65px;min-width:65px;height:65px}.summary{font-size:14px}.section h2{font-size:22px}.gallery{grid-template-columns:1fr}.toc{padding:18px}.cards{grid-template-columns:1fr}}@media print{aside,header,.stats,.notice{display:none}.layout{display:block}main{padding:0}.table{overflow:visible}table{min-width:0}.section{break-inside:auto}}
</style><header><h1>Complete agriculture content library</h1><p>Institution pages, written guides, student blogs and sourced historical updates · 30 October 2026 · <a href="media-review.html">Media gallery</a> · <a href="seo-review.html">Reference audit</a> · <a href="content-seo-audit.html">Content & SEO gaps</a> · <a href="cms-html-preview.html">CMS HTML/CSS preview</a></p></header><div class="stats" id="stats"></div><div class="layout"><aside><label for="search">Find a page</label><input id="search" type="search" placeholder="Institution, place or topic"><label for="kind">Content type</label><select id="kind"><option value="">All content</option><option value="University">University / college overviews</option><option value="UniversityTab">Separate university tab pages</option><option value="Articles">Agriculture guides</option><option value="Blog">Student planning blogs</option><option value="News">Historical official updates</option><option value="State">State collections</option></select><p class="count" id="count"></p><nav id="list" aria-label="Content pages"></nav></aside><main id="content"></main></div>
<script>
/*PUBLICATION_DATA*/
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const docs=[...DATA.institutions,...(DATA.university_tabs||[]),...DATA.posts,...DATA.states],byPath=new Map(docs.map(doc=>[doc.path,doc]));let active;
const imagePath=src=>src.startsWith('/images/institutions/')?'media/'+src.slice('/images/institutions/'.length):src;
const url=href=>{if(href.startsWith('/')&&!href.startsWith('//')){const parts=href.split('#');return byPath.has(parts[0])?'#read='+encodeURIComponent(parts[0])+(parts[1]?'&section='+encodeURIComponent(parts[1]):''):'http://localhost:3003'+href}return /^https?:\/\//.test(href)?href:'#'};
const inline=text=>E(text).replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,href)=>'<a href="'+E(url(href))+'">'+label+'</a>');
const paragraphs=items=>(items||[]).map(text=>'<p>'+inline(text)+'</p>').join('');
const bullets=items=>items?.length?'<ul>'+items.map(text=>'<li>'+inline(text)+'</li>').join('')+'</ul>':'';
const ref=ids=>{const selected=(ids||[]).filter(id=>active.sources.some(s=>s.id===id));return selected.length?'<p class="refs">Sources: '+selected.map(id=>'<a href="#source-'+E(id)+'">['+(active.sources.findIndex(s=>s.id===id)+1)+']</a>').join('')+'</p>':''};
function cards(items){return items?.length?'<div class="cards">'+items.map(item=>{const img=item.media?.find(a=>a.role==='card_logo')||item.media?.find(a=>a.role==='logo');return '<article class="card">'+(img?'<img class="logo '+(img.background==='dark'?'dark':'')+'" src="'+E(imagePath(img.src))+'" alt="'+E(img.alt)+'">':'<span class="card-kind">'+E(item.kind||'Explore institution')+'</span>')+'<h3><a href="'+E(url(item.path||item.href))+'">'+E(item.title||item.name)+'</a></h3><p>'+E(item.description)+'</p></article>'}).join('')+'</div>':''}
function section(s){return '<section class="section" id="'+E(s.id)+'"><h2>'+E(s.heading)+'</h2>'+paragraphs(s.paragraphs)+bullets(s.bullets)+(s.table?'<div class="table" tabindex="0" role="region" aria-label="'+E(s.heading)+' table"><table><thead><tr>'+s.table.columns.map(c=>'<th scope="col">'+E(c)+'</th>').join('')+'</tr></thead><tbody>'+s.table.rows.map(row=>'<tr>'+row.map((c,i)=>i?'<td>'+inline(String(c))+'</td>':'<th scope="row">'+inline(String(c))+'</th>').join('')+'</tr>').join('')+'</tbody></table></div>':'')+(s.subsections||[]).map(sub=>'<h3>'+E(sub.heading)+'</h3>'+paragraphs(sub.paragraphs)+bullets(sub.bullets)+ref(sub.source_ids)).join('')+(s.images?.length?'<div class="gallery">'+s.images.map(img=>'<figure><img src="'+E(imagePath(img.src))+'" alt="'+E(img.alt)+'" loading="lazy"><figcaption>'+E(img.caption)+'</figcaption></figure>').join('')+'</div>':'')+cards(s.university_cards)+cards(s.post_cards)+(s.official_link?'<p><a href="'+E(s.official_link.href)+'" target="_blank" rel="noopener">'+E(s.official_link.label)+'</a></p>':'')+(s.id==='faqs'?active.faqs.map(f=>'<details><summary>'+E(f.question)+'</summary><p>'+inline(f.answer)+'</p>'+ref(f.source_ids)+'</details>').join(''):'')+(s.id==='sources-review'?'<p>'+E(active.byline)+' · Content reviewed '+E(active.reviewed_on)+'. Source notices and fee sessions retain their original dates.</p><ol class="sources">'+active.sources.map(source=>'<li id="source-'+E(source.id)+'"><a href="'+E(source.url)+'" target="_blank" rel="noopener">'+E(source.title)+'</a>'+(source.note?'<p>'+E(source.note)+'</p>':'')+'</li>').join('')+'</ol>':'')+ref(s.source_ids)+'</section>'}
function renderList(){const q=document.querySelector('#search').value.trim().toLowerCase(),kind=document.querySelector('#kind').value,rows=docs.filter(doc=>(!kind||doc.kind===kind)&&(!q||[doc.title,doc.summary,doc.identity?.city,doc.identity?.state].join(' ').toLowerCase().includes(q)));document.querySelector('#count').textContent=rows.length+' pages';document.querySelector('#list').innerHTML=rows.map(doc=>'<button data-path="'+E(doc.path)+'" '+(active?.path===doc.path?'aria-current="page"':'')+'>'+E(doc.title)+'<small>'+E(doc.kind)+' · '+E(doc.identity?.state||doc.byline)+'</small></button>').join('')||'<p>No matching content.</p>'}
function show(path,sectionId){active=byPath.get(path)||DATA.institutions.find(doc=>doc.slug==='rnb-global-university');const logo=active.hero_media?.find(a=>a.role==='card_logo')||active.hero_media?.find(a=>a.role==='logo');document.querySelector('#content').innerHTML='<p class="kind">'+E(active.kind)+' · '+E(active.path)+'</p><div class="hero-identity">'+(logo?'<img class="logo '+(logo.background==='dark'?'dark':'')+'" src="'+E(imagePath(logo.src))+'" alt="'+E(logo.alt)+'">':'')+'<h1>'+E(active.title)+'</h1></div><p class="summary">'+E(active.summary)+'</p><p class="byline">'+E(active.byline)+' · Reviewed '+E(active.reviewed_on)+(active.notice_published_on?' · Official notice published '+E(active.notice_published_on):'')+'</p>'+(active.indexing?.index===false?'<p class="notice"><strong>Search indexing deferred.</strong> '+E(active.indexing.reasons.join(' '))+'</p>':'')+'<div class="notice">Complete structured copy is available in the local frontend and CMS import payload. This is a research snapshot, not a declaration that all facts are verified. Unknown fees and other unsupported facts remain explicitly unquoted; no remote publication or CMS import has been executed.</div>'+(active.tabs?'<nav class="university-tabs" aria-label="University pages">'+active.tabs.map(tab=>'<a href="'+E(url(tab.href))+'" '+(tab.id===active.tab_slug?'aria-current="page"':'')+'>'+E(tab.label)+'</a>').join('')+'</nav>':'')+'<nav class="toc" aria-label="Table of contents"><h2>On this page</h2><ol>'+active.toc.map(item=>'<li><a href="#'+E(item.id)+'">'+E(item.title)+'</a></li>').join('')+'</ol></nav>'+active.sections.map(section).join('')+(!['University','UniversityTab'].includes(active.kind)?cards(active.related_universities)+cards(active.related_posts):'');renderList();if(sectionId)requestAnimationFrame(()=>document.getElementById(sectionId)?.scrollIntoView());else window.scrollTo(0,0)}
function route(){const match=location.hash.match(/^#read=([^&]+)(?:&section=(.*))?/);if(match)show(decodeURIComponent(match[1]),match[2]?decodeURIComponent(match[2]):undefined)}
document.querySelector('#stats').innerHTML=[DATA.institutions.length+' institution overviews',(DATA.university_tabs||[]).length+' separate tab pages',DATA.posts.filter(p=>p.kind==='Articles').length+' written guides',DATA.posts.filter(p=>p.kind==='Blog').length+' written blogs',DATA.posts.filter(p=>p.kind==='News').length+' historical updates',DATA.states.length+' state collections'].map(s=>'<span>'+E(s)+'</span>').join('');
document.querySelector('#search').addEventListener('input',renderList);document.querySelector('#kind').addEventListener('change',renderList);document.querySelector('#list').addEventListener('click',event=>{const button=event.target.closest('[data-path]');if(button){const hash='#read='+encodeURIComponent(button.dataset.path);if(location.hash===hash)show(button.dataset.path);else location.hash=hash}});window.addEventListener('hashchange',route);if(location.hash.startsWith('#read='))route();else show('/university/rnb-global-university');
</script><script data-source-link-policy>const disabledSourceHosts=["pushkaram.in"];function quarantineHistoricalLinks(){for(const link of document.querySelectorAll('a[href]')){try{const host=new URL(link.getAttribute('href'),location.href).hostname.toLowerCase().replace(/^www\./,'');if(disabledSourceHosts.some(blocked=>host===blocked||host.endsWith('.'+blocked))){const text=document.createElement('span');text.textContent=link.textContent+' (historical domain; link disabled)';link.replaceWith(text)}}catch{}}}new MutationObserver(quarantineHistoricalLinks).observe(document.body,{childList:true,subtree:true});quarantineHistoricalLinks();</script></html>
