<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agrico — institution content review</title>
<style>
:root{color-scheme:light;--green:#124b3b;--ink:#183a31;--muted:#65796c;--line:#dce6dc;--sage:#eef4e9}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f8faf6;font:14px/1.65 system-ui,Arial,sans-serif}button,input,select{font:inherit}button,a{touch-action:manipulation}a{color:var(--green);overflow-wrap:anywhere}button{cursor:pointer}header{padding:23px 30px;background:var(--green);color:white}header p{margin:5px 0 0;color:#d2e4d8}header h1{margin:0;font-size:25px;line-height:1.2}header small{display:block;letter-spacing:1.5px;font-size:10px;margin-bottom:7px}.stats{display:flex;gap:9px;flex-wrap:wrap;padding:15px 30px;border-bottom:1px solid var(--line);background:white}.stats span{padding:7px 12px;border-radius:5px;background:var(--sage);font-size:12px}.shell{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1520px;margin:auto;align-items:start}aside{position:sticky;top:0;height:100dvh;overflow:auto;padding:22px 18px;border-right:1px solid var(--line);background:white}aside label{display:block;font-size:12px;font-weight:650}input,select{width:100%;padding:10px 12px;margin:6px 0 12px;border:1px solid #cbd8ca;border-radius:5px;background:white;color:var(--ink)}aside button{display:block;width:100%;padding:11px;text-align:left;border:1px solid transparent;border-radius:5px;background:none;color:var(--ink);line-height:1.4;font-size:12px}aside button:hover,aside button[aria-current]{background:var(--sage);border-color:#d8e3d1}aside button small{display:block;margin-top:4px;color:var(--muted);font-size:10px}#results{display:block;font-size:11px;color:var(--muted);margin-bottom:10px}main{padding:25px 34px 60px;min-width:0}main h2{font-size:29px;line-height:1.2;margin:0 0 12px;letter-spacing:-.7px}main h3{font-size:20px;line-height:1.35;margin:0 0 13px}main h4{font-size:15px;margin:15px 0 7px}main p{margin:8px 0 13px}section{padding:23px 0;border-top:1px solid var(--line);scroll-margin-top:20px}section:first-child{border-top:0;padding-top:0}.eyebrow{font-size:10px;letter-spacing:1.3px;font-weight:650;text-transform:uppercase;color:var(--muted)}.notice{border-left:3px solid #9cae78;background:#f1f4e8;padding:12px 16px;font-size:12px;margin:18px 0}.links{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;margin:12px 0}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.facts>div{background:white;border:1px solid var(--line);padding:12px;border-radius:5px;overflow-wrap:anywhere}.facts small{display:block;color:var(--muted);font-size:10px}.facts strong{font-size:12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{padding:17px;background:white;border:1px solid var(--line);border-radius:6px;min-width:0}.card h4{margin-top:0}.label{display:inline-block;padding:3px 7px;border-radius:3px;background:var(--sage);font-size:10px;margin:0 4px 6px 0}.unverified{color:#77571c;background:#faf1dc}.source-refs{font-size:10px;color:var(--muted);margin:7px 0}.source-refs a{margin-right:8px}ul,ol{padding-left:21px}li{margin-block:5px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;padding:10px;border:1px solid var(--line);vertical-align:top;min-width:110px}th{background:var(--sage)}details{border:1px solid var(--line);border-radius:5px;background:white;padding:12px 15px;margin-top:9px}summary{font-weight:650;cursor:pointer}.source-list{font-size:12px}.source-list li{margin-bottom:13px}.source-list small{display:block;color:var(--muted)}.toolbar{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}.toolbar button{padding:9px 13px;background:white;border:1px solid var(--line);border-radius:5px;color:var(--green)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.empty{padding:35px;background:white;border:1px solid var(--line)}@media(max-width:950px){.shell{grid-template-columns:245px minmax(0,1fr)}main{padding:24px}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:1fr}}@media(max-width:650px){header{padding:22px 18px}.stats{padding:12px 18px;gap:6px}.shell{display:block}aside{position:static;height:auto;padding:17px 18px;border-right:0;border-bottom:1px solid var(--line)}#institution-list{max-height:230px;overflow:auto}main{padding:24px 18px}main h2{font-size:26px}input,select{font-size:16px;min-height:44px}.facts{grid-template-columns:1fr 1fr}aside button{min-height:44px}}@media print{header,.stats{background:white;color:black}.shell{display:block}aside,.toolbar,.notice{display:none}main{padding:0}.cards,.facts{break-inside:avoid}section{break-inside:auto}a{color:black}}
</style>
<header><small>AGRICO · EDITORIAL WORKSPACE</small><h1>Institution content review</h1><p>Original agriculture education copy · evidence checked 30 October 2026 · draft for content review</p></header>
<div class="stats" id="stats"></div><div class="shell"><aside><label for="search">Find an institution</label><input id="search" type="search" placeholder="Name, state or programme"><label for="state">Filter by state</label><select id="state"><option value="">All states</option></select><div class="toolbar"><button id="requirements">Content checklist</button><button id="coverage">Coverage</button></div><div class="links"><a href="media-review.html">Stored logos &amp; photos</a><a href="seo-review.html">SEO audit &amp; status</a><a href="publication-review.html">Complete linked content</a></div><span id="results"></span><nav id="institution-list" aria-label="Institution profiles"></nav></aside><main id="content"></main></div>
<script>
/*CONTENT_DATA*/
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const profiles=DATA.pack.institutions;let active=null;
const paragraph=s=>s?'<p>'+E(s)+'</p>':'';
const list=(items,ordered=false)=>items?.length?'<'+(ordered?'ol':'ul')+'>'+items.map(item=>'<li>'+E(item)+'</li>').join('')+'</'+(ordered?'ol':'ul')+'>':'';
const section=(id,title,body)=>'<section id="'+E(id)+'"><h3>'+E(title)+'</h3>'+body+'</section>';
const refs=ids=>ids?.length?'<div class="source-refs">Sources: '+ids.map(id=>'<a href="#source-'+E(id)+'">'+E(id)+'</a>').join('')+'</div>':'';
const note=s=>'<div class="notice">'+E(s)+'</div>';
const money=f=>typeof f?.amount_inr==='number'?new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(f.amount_inr)+' / '+E(f.period):'<span class="label unverified">Current fee unverified</span>';
$('#stats').innerHTML=['Prepared '+profiles.length+' / 58 profiles',DATA.report.programme_rows+' programme rows',DATA.report.unique_source_urls+' unique sources',DATA.report.verified_fee_rows+' sourced fee rows',DATA.report.total_verification_gaps+' facts awaiting verification'].map(s=>'<span>'+E(s)+'</span>').join('');
[...new Set(profiles.map(p=>p.identity.state))].sort().forEach(s=>{const option=document.createElement('option');option.value=s;option.textContent=s;$('#state').append(option)});
function renderList(){const q=$('#search').value.trim().toLowerCase(),state=$('#state').value;const visible=profiles.filter(p=>(!state||p.identity.state===state)&&[p.name,p.identity.short_name,p.audit_name,p.identity.state,p.identity.city,...p.programmes.map(r=>r.name)].join(' ').toLowerCase().includes(q));$('#results').textContent=visible.length+' profiles';$('#institution-list').innerHTML=visible.map(p=>'<button type="button" data-id="'+p.id+'" '+(active===p.id?'aria-current="page"':'')+'>'+E(p.name)+'<small>'+E(p.identity.city||'')+' · '+E(p.identity.state)+'</small></button>').join('')||(q?'<p>No matching profile.</p>':'<p>Profiles are being prepared.</p>')}
function showProfile(id){const p=profiles.find(p=>p.id===id);if(!p)return;active=id;renderList();location.hash='institution-'+id;const i=p.identity;
let html='<section><span class="eyebrow">'+E(p.hero.eyebrow)+'</span><h2>'+E(p.hero.title)+'</h2>'+paragraph(p.hero.summary)+'<div class="links"><a href="'+E(i.website)+'" target="_blank" rel="noopener">Official website ↗</a>'+(i.admissions_url?'<a href="'+E(i.admissions_url)+'" target="_blank" rel="noopener">Official admissions ↗</a>':'')+'</div>'+note('Editorial research draft. Missing facts are recorded below; programme accreditation does not establish accreditation for every campus or degree.')+'<div class="facts">'+[['Institution',i.kind==='private_college'?'Private college':'Private / deemed university'],['Location',[i.city,i.state].filter(Boolean).join(', ')],['Ownership',i.ownership],['Established',i.established],['Affiliating / parent university',i.parent_university],['Address',i.address],['Phone',i.phone],['Email',i.email]].filter(([,v])=>v).map(([k,v])=>'<div><small>'+E(k)+'</small><strong>'+E(v)+'</strong></div>').join('')+'</div></section>';
html+=section('overview',p.overview.heading,p.overview.paragraphs.map(paragraph).join('')+'<div class="facts">'+p.overview.highlights.map(f=>'<div><small>'+E(f.label)+'</small><strong>'+E(f.value)+'</strong></div>').join('')+'</div>'+refs(p.overview.source_ids));
html+=section('programmes','Agriculture and allied programmes','<div class="cards">'+p.programmes.map(r=>'<article class="card"><span class="label">'+E(r.level)+'</span>'+(r.duration?'<span class="label">'+E(r.duration)+'</span>':'')+'<h4>'+E(r.name)+'</h4>'+paragraph(r.summary)+'<p><strong>Eligibility:</strong> '+E(r.eligibility||'Not independently verified')+'</p><p><strong>Admission route:</strong> '+E(r.admission_route||'Not independently verified')+'</p><p><strong>Published fee:</strong> '+money(r.fees)+'</p>'+paragraph([r.fees?.academic_year?'Source year: '+r.fees.academic_year:'',r.fees?.includes,r.fees?.note].filter(Boolean).join(' · '))+paragraph(r.icar_scope_note)+refs([...(r.source_ids||[]),...(r.fees?.source_ids||[])])+'</article>').join('')+'</div>');
html+=section('admissions',p.admissions.heading,paragraph(p.admissions.intro)+(p.admissions.application_fee_inr!==null&&p.admissions.application_fee_inr!==undefined?'<p><strong>Published application fee:</strong> INR '+E(p.admissions.application_fee_inr)+'</p>':'')+list(p.admissions.eligibility_points)+'<ol>'+p.admissions.steps.map(s=>'<li><strong>'+E(s.title)+'</strong>'+paragraph(s.text)+'</li>').join('')+'</ol>'+(p.admissions.documents.length?'<h4>Published document requirements</h4>'+list(p.admissions.documents):'')+(p.admissions.dates.length?'<h4>Dated admission information</h4>'+list(p.admissions.dates.map(d=>d.label+': '+d.date+' ('+d.academic_year+')')):'')+refs(p.admissions.source_ids));
html+=section('campus',p.campus.heading,paragraph(p.campus.intro)+'<div class="cards">'+p.campus.facilities.map(f=>'<article class="card"><h4>'+E(f.name)+'</h4>'+paragraph(f.description)+refs(f.source_ids)+'</article>').join('')+'</div>'+list(p.campus.practical_learning)+refs(p.campus.source_ids));
html+=section('scholarships',p.scholarships.heading,paragraph(p.scholarships.text)+p.scholarships.schemes.map(s=>'<h4>'+E(s.name)+'</h4>'+paragraph(s.details)+refs(s.source_ids)).join('')+refs(p.scholarships.source_ids));
html+=section('placements',p.placements.heading,paragraph(p.placements.text)+(p.placements.statistics.length?'<div class="facts">'+p.placements.statistics.map(s=>'<div><small>'+E(s.label)+' · '+E(s.year)+'</small><strong>'+E(s.value)+'</strong><small>'+E(s.scope)+'</small>'+refs(s.source_ids)+'</div>').join('')+'</div>':'')+(p.placements.recruiters.length?'<h4>Verified agriculture-linked recruiters</h4>'+list(p.placements.recruiters):'')+refs(p.placements.source_ids));
html+=section('recognition',p.recognition.heading,paragraph(p.recognition.text)+p.recognition.icar_units.map(u=>'<article class="card"><h4>'+E(u.unit)+'</h4><p><strong>ICAR term:</strong> '+E(u.valid_from)+' to '+E(u.valid_until)+'</p>'+list(u.programmes_as_printed.filter(label=>label.trim()&&label.trim()!=='_'))+'<a href="'+E(u.source_url)+'" target="_blank" rel="noopener">ICAR source · '+E(u.source_range)+'</a></article>').join('')+p.recognition.other_recognitions.map(r=>'<h4>'+E(r.name)+'</h4>'+paragraph(r.scope)+refs(r.source_ids)).join('')+refs(p.recognition.source_ids));
html+=section('faculty','Academic people',paragraph(p.faculty.intro)+p.faculty.people.map(f=>'<p><strong>'+E(f.name)+'</strong> · '+E(f.role)+'</p>'+refs(f.source_ids)).join('')+refs(p.faculty.source_ids));
html+=section('faqs','Applicant FAQs',p.faqs.map(f=>'<details><summary>'+E(f.question)+'</summary>'+paragraph(f.answer)+refs(f.source_ids)+'</details>').join(''));
html+=section('seo','SEO and image copy','<p><strong>SEO title:</strong> '+E(p.seo.title)+'</p><p><strong>Description:</strong> '+E(p.seo.description)+'</p><p><strong>Keywords:</strong> '+E(p.seo.keywords.join(', '))+'</p><p><strong>Campus alt text idea:</strong> '+E(p.media.campus_alt)+'</p><p><strong>Caption idea:</strong> '+E(p.media.caption)+'</p>'+paragraph('Asset rights: '+p.media.rights_status));
html+=section('related','Other institutions to explore',list((p.related||[]).map(r=>r.name+' — '+r.selection)));
html+=section('gaps','Facts requiring editorial verification',p.verification_gaps.length?'<ul>'+p.verification_gaps.map(g=>'<li><strong>'+E(g.field)+'</strong>: '+E(g.reason)+(g.next_source?'<br><small>Next source: '+E(g.next_source)+'</small>':'')+'</li>').join('')+'</ul>':paragraph('No additional gaps recorded. Source dates and scope still apply.'));
html+=section('sources','Source register','<ol class="source-list">'+p.sources.map(s=>'<li id="source-'+E(s.id)+'"><a href="'+E(s.url)+'" target="_blank" rel="noopener">'+E(s.title)+'</a><small>'+E(s.id)+' · '+E(s.kind)+' · '+E(s.access)+' · checked '+E(s.checked_on)+'</small><small>Supports: '+E((s.supports||[]).join(', '))+'</small>'+paragraph(s.notes||s.note)+'</li>').join('')+'</ol>');
$('#content').innerHTML=html;window.scrollTo({top:0,behavior:'instant'});}
function showRequirements(){active=null;renderList();$('#content').innerHTML='<section><span class="eyebrow">PAGE CONTENT REQUIREMENTS</span><h2>Every content type the detail page needs</h2>'+paragraph(DATA.requirements.scope)+note('This checklist describes required content. The coverage view separately reports which facts have actually been verified.')+'</section>'+DATA.requirements.sections.map(s=>section(s.id,s.label,list(s.required)+paragraph('UI destination: '+s.current_ui))).join('')+section('rules','Editorial rules',list(DATA.requirements.publication_rules));location.hash='requirements';}
function showCoverage(){active=null;renderList();$('#content').innerHTML='<section><h2>Content coverage and verification</h2>'+note('Prepared sections are different from confirmed current-year facts. Fee, eligibility and gap counts below expose the distinction.')+paragraph(DATA.report.prepared_institutions+' of 58 profiles prepared; '+DATA.report.programme_rows+' programme rows; '+DATA.report.unique_source_urls+' unique source URLs.')+'</section><div class="table-wrap"><table><thead><tr><th>Institution</th><th>Programmes</th><th>Sourced fees / 2026 session</th><th>Eligibility present</th><th>Sources / pages read</th><th>Open gaps</th></tr></thead><tbody>'+DATA.report.records.map(r=>'<tr><td><button data-id="'+r.id+'">'+E(r.name)+'</button></td><td>'+r.programmes+'</td><td>'+r.fees_verified+'</td><td>'+r.eligibility_verified+'</td><td>'+r.sources+' / '+r.pages_read+'</td><td>'+r.gaps+'</td></tr>').join('')+'</tbody></table></div>'+(DATA.report.missing.length?section('missing','Profiles not yet prepared',list(DATA.report.missing.map(r=>r.id+'. '+r.name))):'');location.hash='coverage';window.scrollTo(0,0)}
$('#search').addEventListener('input',renderList);$('#state').addEventListener('change',renderList);$('#institution-list').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)showProfile(Number(b.dataset.id))});$('#content').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)showProfile(Number(b.dataset.id))});$('#requirements').addEventListener('click',showRequirements);$('#coverage').addEventListener('click',showCoverage);renderList();const selected=Number(location.hash.match(/^#institution-(\d+)/)?.[1]);if(selected&&profiles.some(p=>p.id===selected))showProfile(selected);else showRequirements();
</script><script data-source-link-policy>const disabledSourceHosts=["pushkaram.in"];function quarantineHistoricalLinks(){for(const link of document.querySelectorAll('a[href]')){try{const host=new URL(link.getAttribute('href'),location.href).hostname.toLowerCase().replace(/^www\./,'');if(disabledSourceHosts.some(blocked=>host===blocked||host.endsWith('.'+blocked))){const text=document.createElement('span');text.textContent=link.textContent+' (historical domain; link disabled)';link.replaceWith(text)}}catch{}}}new MutationObserver(quarantineHistoricalLinks).observe(document.body,{childList:true,subtree:true});quarantineHistoricalLinks();</script></html>
