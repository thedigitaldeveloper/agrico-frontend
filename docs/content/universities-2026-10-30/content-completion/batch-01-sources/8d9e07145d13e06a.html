*{margin:0;padding:0;box-sizing:border-box}
.text-muted {
    --bs-text-opacity: 1;

}h2{font-size:1.8rem;}
body{
  font-family:'Poppins',sans-serif;
  color:#222;
background:
  radial-gradient(circle at 10% 20%, rgba(102, 187, 106, 0.25), transparent 45%),
  radial-gradient(circle at 90% 80%, rgba(165, 214, 167, 0.25), transparent 45%),
  linear-gradient(135deg, #e8f5e9, #ffffff 60%);

  background-attachment:fixed;
}

/* COMMON */
.container {
    max-width: 1200px;
    margin: auto;
    padding: 12px 7px;
}
.section-card{
  background:#ffffffcc;
  backdrop-filter: blur(8px);
  border-radius:22px;
  padding:50px;
  box-shadow:0 30px 60px rgba(0,0,0,.12);
  margin-bottom:70px;
}




/* LOGO */
.logo img{
  width:280px;
  max-width:100%;
  display:block;
  margin:auto;
}

/* IMAGE */
.about-image img{
  width:100%;
  border-radius:20px;
  box-shadow:0 25px 50px rgba(0,0,0,.25);
  transition:.4s ease;
}
.about-image img:hover{
  transform:scale(1.03);
}

/* CONTENT */
.badge {
    display: inline-block;
    padding: 8px 11px;
    border-radius: 30px;
    background: linear-gradient(45deg, #ff9800, #ff5722);
    color: #fff !important;
    font-size: 13px;
    margin-bottom: 12px !important;
}
.about-content h2{
  font-size:34px;
  font-weight:700;
  background:linear-gradient(90deg,#0f4c81,#1fa2ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:20px;
}

.about-content p{
  font-size:15.5px;
  line-height:1.9;
  text-align:justify;
  margin-bottom:18px;
  color:#444;
}

/* HIGHLIGHT */
.highlight{
  background:linear-gradient(135deg,#0f4c81,#1fa2ff);
  color:#fff;
  padding:20px;
  border-left:6px solid #ffcc00;
  border-radius:14px;
  margin:25px 0;
  box-shadow:0 15px 30px rgba(0,0,0,.2);
}

/* BUTTONS */
.btn-group{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.btn{
  padding:14px 34px;
  border-radius:30px;
  font-weight:600;
  text-decoration:none;
  transition:.3s ease;
}

.btn-admission{
  background:linear-gradient(45deg,#ff9800,#ff5722);
  color:#fff;
  box-shadow:0 12px 28px rgba(255,87,34,.4);
}
.btn-admission:hover{
  transform:translateY(-4px);
}

.btn-brochure{
  border:2px solid #0f4c81;
  color:#0f4c81;
  background:#fff;
}
.btn-brochure:hover{
  background:#0f4c81;
  color:#fff;
}

/* RESPONSIVE */
@media(max-width:900px){

  .about-content h2{font-size:26px}
  .section-card{padding:30px}
  .btn-group{justify-content:center}
  .about-content{text-align:center}
}

}
