<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agrico — institution media library</title>
<style>
:root{color-scheme:light;--g:#124b3b;--ink:#183a31;--muted:#63776a;--line:#d9e3d7}*{box-sizing:border-box}body{margin:0;background:#f6f9f3;color:var(--ink);font:14px/1.6 system-ui,Arial,sans-serif}header{padding:25px 30px;background:var(--g);color:white}h1{font-size:26px;line-height:1.2;margin:0 0 9px}header p{margin:0;color:#d7e4d4;font-size:13px}a{color:var(--g);overflow-wrap:anywhere}header a{color:#e4efbd}.stats{display:flex;flex-wrap:wrap;gap:8px;padding:16px 30px;background:white;border-bottom:1px solid var(--line)}.stats span{font-size:12px;background:#eaf2e3;padding:7px 12px;border-radius:5px}.tools{max-width:1440px;margin:20px auto 0;padding:0 25px;display:flex;gap:10px;flex-wrap:wrap}input,select{padding:11px 14px;border:1px solid #cbd8c5;border-radius:5px;background:white;color:var(--ink);font:inherit;min-height:44px}input{flex:1;min-width:200px}select{min-width:160px}main{max-width:1440px;margin:auto;padding:20px 25px 60px}.institution{padding:23px 0;border-bottom:1px solid var(--line)}.identity{display:flex;align-items:baseline;justify-content:space-between;gap:18px;margin-bottom:14px}.identity h2{margin:0;font-size:20px;line-height:1.35}.identity small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.status{flex-shrink:0;font-size:10px;text-transform:uppercase;letter-spacing:.6px;background:#e1edcf;color:var(--g);padding:4px 9px;border-radius:4px}.status.partial{background:#f8edcf;color:#7a5c21}.assets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.asset{margin:0;min-width:0;background:white;border:1px solid var(--line);border-radius:6px;overflow:hidden}.preview{height:180px;background:#eef3e9;display:flex;justify-content:center;align-items:center;border-bottom:1px solid var(--line)}.preview img{max-width:100%;height:100%;width:100%;object-fit:cover}.preview.logo{padding:18px;background:white}.preview.logo img{object-fit:contain}.preview.dark{background:#183a31}.asset figcaption{padding:13px}.asset h3{margin:0 0 5px;font-size:12px}.asset p{font-size:11px;color:var(--muted);margin:5px 0 8px}.links{display:flex;gap:12px;flex-wrap:wrap;font-size:11px}.meta{font-size:10px;color:var(--muted);margin-top:8px}.gap{padding:15px 17px;border:1px dashed #d7dcbf;background:#f7f4e6;border-radius:5px;color:#766b42;font-size:12px}.empty{padding:30px;text-align:center;color:var(--muted)}.count{padding:0 25px;color:var(--muted);max-width:1440px;margin:12px auto 0;font-size:12px}.note{font-size:11px;color:var(--muted);margin-top:9px}@media(max-width:1100px){.assets{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:780px){.assets{grid-template-columns:repeat(2,minmax(0,1fr))}.preview{height:165px}}@media(max-width:480px){header{padding:23px 17px}.stats{padding:13px 17px}.tools{padding-inline:17px}.tools select{width:100%}input,select{font-size:16px}main{padding:17px}.identity{align-items:flex-start}.identity h2{font-size:18px}.assets{grid-template-columns:1fr}.preview{height:215px}.preview.logo{height:150px}.count{padding-inline:17px}}@media print{.tools{display:none}.institution{break-inside:avoid}.assets{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style><header><h1>Institution logos &amp; campus photos</h1><p>Stored originals with source provenance and CMS field mapping · 30 October 2026 · <a href="review.html">Back to content review</a></p></header><div class="stats" id="stats"></div><div class="tools"><input id="search" type="search" aria-label="Find institution" placeholder="Search institution name or slug"><select id="status" aria-label="Collection status"><option value="">All institutions</option><option value="complete">Logo + campus stored</option><option value="partial">Incomplete collection</option></select></div><p class="count" id="count"></p><main id="gallery"></main>
<script>
/*MEDIA_DATA*/
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={logo:'Institution logo',card_logo:'Compact official mark',campus_primary:'Primary campus photo',campus_secondary:'Additional campus photo'};
const stats=DATA.report;document.getElementById('stats').innerHTML=[stats.complete+' / 58 institutions collected',stats.logos+' logos',stats.card_logos+' compact marks',stats.campus_photos+' campus photos',(stats.total_bytes/1048576).toFixed(1)+' MB stored'].map(s=>'<span>'+E(s)+'</span>').join('');
function draw(){const query=document.getElementById('search').value.trim().toLowerCase(),status=document.getElementById('status').value;const rows=DATA.records.filter(r=>(!query||(r.name+' '+r.slug).toLowerCase().includes(query))&&(!status||(status==='complete'?r.status==='complete':r.status!=='complete')));document.getElementById('count').textContent=rows.length+' institutions';document.getElementById('gallery').innerHTML=rows.map(row=>'<section class="institution" data-institution="'+row.id+'"><div class="identity"><div><h2>'+E(row.name)+'</h2><small>'+E(row.slug)+'</small></div><span class="status '+(row.status==='complete'?'':'partial')+'">'+(row.status==='complete'?'Stored':'Pending assets')+'</span></div><div class="assets">'+row.assets.map(asset=>'<figure class="asset"><a class="preview '+(asset.role.includes('logo')?'logo':'')+(asset.display_background==='dark'?' dark':'')+'" href="'+E(asset.file)+'" target="_blank"><img src="'+E(asset.file)+'" alt="'+E(asset.alt)+'" loading="lazy"></a><figcaption><h3>'+E(labels[asset.role]||asset.role)+'</h3><p>'+E(asset.description||asset.alt)+'</p><div class="links"><a href="'+E(asset.file)+'" download>Original file</a><a href="'+E(asset.source_page)+'" target="_blank" rel="noopener">Source page ↗</a></div><div class="meta">'+E(asset.width)+' × '+E(asset.height)+' · '+E(asset.format)+' · '+Math.ceil(asset.bytes/1024)+' KB · CMS: '+E(asset.cms_field)+'</div><p>'+E(asset.identity_evidence)+'</p>'+(asset.notes?'<p>'+E(asset.notes)+'</p>':'')+'</figcaption></figure>').join('')+'</div>'+(row.gaps?.length?'<div class="note">'+row.gaps.map(g=>E(g.role)+': '+E(g.reason)).join('<br>')+'</div>':'')+(!row.assets.length?'<div class="gap">No verified image files stored for this institution yet.</div>':'')+'</section>').join('')||'<p class="empty">No matching institution.</p>'}
document.getElementById('search').addEventListener('input',draw);document.getElementById('status').addEventListener('change',draw);draw();
</script><script data-source-link-policy>const disabledSourceHosts=["pushkaram.in"];function quarantineHistoricalLinks(){for(const link of document.querySelectorAll('a[href]')){try{const host=new URL(link.getAttribute('href'),location.href).hostname.toLowerCase().replace(/^www\./,'');if(disabledSourceHosts.some(blocked=>host===blocked||host.endsWith('.'+blocked))){const text=document.createElement('span');text.textContent=link.textContent+' (historical domain; link disabled)';link.replaceWith(text)}}catch{}}}new MutationObserver(quarantineHistoricalLinks).observe(document.body,{childList:true,subtree:true});quarantineHistoricalLinks();</script></html>
